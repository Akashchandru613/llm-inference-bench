[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-bench"
version = "0.1.0"
description = "Reproducible benchmark suite for open-weight LLM inference: quantization x speculative decoding x batching x context length."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akash Chandrasekharan" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "datasets>=2.18",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.3",
  "vllm>=0.5.0",
  "transformers>=4.41",
  "accelerate>=0.30",
  "autoawq>=0.2.5",
]
judge = [
  "anthropic>=0.30",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[project.scripts]
llm-bench = "llm_bench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
